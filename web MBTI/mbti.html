  explanation:{
    en:'<p>Each letter is a <b>preference</b>, not a box. You use both sides of every pair, but one usually feels more natural — like being right- or left-handed.</p>'+
       '<h4>The four dimensions</h4>'+
       '<p><b>Extraversion (E) / Introversion (I):</b> Extraverts recharge around people and think out loud; introverts recharge in solitude and process internally.</p>'+
       '<p><b>Sensing (S) / Intuition (N):</b> Sensors trust direct experience, details and the present; intuitives are drawn to patterns, meaning and future possibilities.</p>'+
       '<p><b>Thinking (T) / Feeling (F):</b> Thinkers prioritize logic, fairness and consistency; feelers weigh harmony, empathy and personal values.</p>'+
       '<p><b>Judging (J) / Perceiving (P):</b> Judgers like plans, structure and closure; perceivers like flexibility, spontaneity and keeping options open.</p>'+

       '<p>Your type highlights natural strengths, blind spots, communication style and how you tend to handle stress and relationships. It is a mirror for self-reflection — not a destiny or a limit.</p>'+

    sk:'<p>Každé písmeno je <b>preferencia</b>, nie škatuľka. Používaš obe strany každej dvojice, ale jedna ti zvyčajne sedí prirodzenejšie — ako keď si pravák alebo ľavák.</p>'+

       '<p><b>Extraverzia (E) / Introverzia (I):</b> Extraverti čerpajú energiu medzi ľuďmi a premýšľajú nahlas; introverti načerpajú v samote a spracúvajú veci vnútri.</p>'+
       '<p><b>Zmysly (S) / Intuícia (N):</b> Zmyslové typy veria priamej skúsenosti, detailom a prítomnosti; intuitívne typy priťahujú vzorce, význam a budúce možnosti.</p>'+
       '<p><b>Myslenie (T) / Cítenie (F):</b> Mysliace typy uprednostňujú logiku, férovosť a dôslednosť; cítiace typy zvažujú harmóniu, empatiu a osobné hodnoty.</p>'+
       '<p><b>Usudzovanie (J) / Vnímanie (P):</b> Usudzujúce typy majú radi plány, štruktúru a uzavretie; vnímajúce typy majú radi flexibilitu, spontánnosť a otvorené možnosti.</p>'+
       '<h4>Čo o tebe typ hovorí</h4>'+

  },
